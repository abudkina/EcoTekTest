# Фрагмент для nginx (если сайт не на Apache).
# Вставьте в server { } для ecotek-as.ru и www.ecotek-as.ru

server {
    listen 80;
    listen [::]:80;
    server_name ecotek-as.ru www.ecotek-as.ru;
    return 301 https://ecotek-as.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ecotek-as.ru;
    return 301 https://ecotek-as.ru$request_uri;
}

